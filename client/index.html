<!doctype html>
<!--
  client/index.html — kerangka halaman tunggal yang dimuat browser.
  Dipanggil oleh: Vite (dev) / Express dari dist/index.html (production).
  Memanggil: src/main.ts, yang memasang aplikasi Vue ke <div id="app">.
-->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: di Chrome Android, keyboard memperkecil area halaman (bukan menutupinya). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Ujian</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
